[package]
name = "melodia"
version = "0.1.0"
edition = "2021"
description = "Lean Spotify-style music player (GTK4 + libadwaita + GStreamer)"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
gst = { package = "gstreamer", version = "0.23" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
async-channel = "2"
md5 = "0.7"
dirs = "5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
