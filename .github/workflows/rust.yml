name: Rust

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Package Ubuntu 24.04 .deb
        if: github.event_name != 'pull_request'
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          package="melodia-rust_${version}_amd64"
          mkdir -p "${package}/DEBIAN" "${package}/usr/bin" "${package}/usr/share/applications"
          install -m 0755 target/release/melodia "${package}/usr/bin/melodia-rs"
          sed 's|^Exec=.*|Exec=/usr/bin/melodia-rs|' org.melodia.PlayerRs.desktop \
            > "${package}/usr/share/applications/org.melodia.PlayerRs.desktop"
          cat > "${package}/DEBIAN/control" <<EOF
          Package: melodia-rust
          Version: ${version}
          Section: sound
          Priority: optional
          Architecture: amd64
          Depends: libgtk-4-1, libadwaita-1-0, libgstreamer1.0-0, libgstreamer-plugins-base1.0-0, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-libav, python3, yt-dlp
          Maintainer: adhamhasy
          Description: Lean Spotify-style music player built with GTK4 and GStreamer
          EOF
          deb="${package}.deb"
          dpkg-deb --build --root-owner-group "${package}" "${deb}"
          echo "deb=${deb}" >> "$GITHUB_OUTPUT"

      - name: Upload .deb workflow artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: melodia-rust-ubuntu-24.04-amd64
          path: ${{ steps.package.outputs.deb }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish .deb on GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.deb }}" --generate-notes
